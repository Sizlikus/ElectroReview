name: Telegram KHL PDF deploy

on:
  push:
    branches:
      - telegram-bot-deploy-temp-20260922
    paths:
      - '.github/workflows/telegram-khl-deploy.yml'

jobs:
  check-netlify-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Check Netlify token availability
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "NETLIFY_AUTH_TOKEN repository secret is not configured"
            exit 2
          fi
          echo "Netlify deploy authorization is configured"
